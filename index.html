<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Regula Posse — Sistema de Regulação Municipal</title>
<!-- Content-Security-Policy. Objetivo principal: nenhum script de origem
     não prevista roda, e nenhum dado sai para um endereço não previsto
     (connect-src), o que limita o estrago de um CDN comprometido ou de um
     XSS. 'unsafe-inline' em style-src é necessário porque a folha de
     estilo e vários atributos style= são inline; estilo inline não executa
     código. Nenhum script inline existe mais no arquivo: os handlers que
     eram onclick viraram data-acao.
     Para fechar o script-src em 'self' apenas, rode
     ferramentas/vendorizar-supabase.sh e tire o jsdelivr da linha abaixo.
     frame-ancestors, report-to e sandbox são ignorados em <meta>: se o
     servidor puder enviar cabeçalho, mande esta mesma política por
     cabeçalho e acrescente "frame-ancestors 'none'". -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://*.supabase.co; object-src 'none'; base-uri 'self'; form-action 'none'">
<link rel="icon" type="image/png" href="assets/regula-posse-emblema.png">
<style>
/* =====================================================================
   REGULA POSSE — padrão visual
   Cores, tipografia e espaçamentos centralizados nas variáveis abaixo.
   ===================================================================== */
:root{
  --azul:#0b4f7c; --azul-esc:#073a5c; --azul-900:#052b45; --azul-cl:#e8f1f8; --azul-50:#f3f8fc;
  --teal:#1d8a8a; --teal-cl:#e3f4f4;
  --bg:#f2f4f7; --card:#fff; --borda:#d5dce4; --borda-forte:#b8c4d0;
  --txt:#16212c; --muted:#56657a; --sutil:#8796a8;
  --ok:#1b7a37; --ok-cl:#e5f3e9; --warn:#a85d00; --warn-cl:#fff4dc; --err:#b42318; --err-cl:#fdecea; --info-cl:#e8f1f8;
  --p-vermelho:#c62828; --p-amarelo:#e0a400; --p-verde:#2e7d32; --p-azul:#1565c0;
  --foco:#f2b705;
  --r-sm:6px; --r:10px; --r-lg:14px;
  --sombra:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.06);
  --sombra-lg:0 12px 32px rgba(16,24,40,.18);
  --fs-xs:12px; --fs-sm:13px; --fs:14.5px; --fs-md:16px; --fs-lg:19px; --fs-xl:24px;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:var(--fs);line-height:1.45;color:var(--txt);background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,h4{margin:0 0 .5em;line-height:1.25}
h3{font-size:var(--fs-md)}
a{color:var(--azul)}
p{margin:0 0 .75em}
.hidden{display:none!important}
.sr-only{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
:focus-visible{outline:3px solid var(--foco);outline-offset:2px;border-radius:4px}
input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--foco);outline-offset:0;border-color:var(--azul-900)}
[tabindex="-1"]:focus{outline:none}
.pular{position:absolute;left:8px;top:-60px;z-index:200;background:var(--foco);color:#000;padding:10px 14px;border-radius:6px;font-weight:700;text-decoration:none}
.pular:focus{top:8px}
.muted{color:var(--muted)}
/* Espera do pedido médico muito maior que a da fila: a unidade demorou a
   lançar e o paciente perdeu esse tempo sem ninguém ver. */
td small.atraso{color:var(--warn);font-weight:600}
/* a segunda espera cabe numa linha; quebrada, engorda a altura de toda a lista */
td.n small{white-space:nowrap}
.nowrap{white-space:nowrap}
.spacer{flex:1}

/* ---------- Entrada ---------- */
#auth{min-height:100vh;display:grid;place-items:center;padding:24px;background:linear-gradient(160deg,var(--azul-900),var(--azul) 70%)}
.auth-box{background:#fff;border-radius:var(--r-lg);padding:28px;width:100%;max-width:440px;box-shadow:var(--sombra-lg)}
.auth-brand{display:flex;align-items:center;gap:16px;margin-bottom:24px}
.auth-brand img{width:76px;height:76px;object-fit:contain;flex:none}
.auth-brand strong{display:block;color:var(--azul-900);font-size:26px;line-height:1.1}
.auth-brand small{display:block;color:var(--muted);font-size:12px;letter-spacing:.04em;text-transform:uppercase;margin-top:4px}
.auth-box .direitos{margin:24px 0 0;padding-top:16px;border-top:1px solid var(--borda)}
.perfil-btn{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 14px;border:1px solid var(--borda);border-radius:var(--r);background:#fff;cursor:pointer;min-height:56px}
.perfil-btn:hover{border-color:var(--azul);background:var(--azul-50)}
.perfil-btn img{width:32px;height:32px}
.perfil-btn small{display:block;color:var(--muted)}

/* ---------- Estrutura ---------- */
#app{display:grid;grid-template-columns:256px 1fr;min-height:100vh}
aside{background:var(--azul-900);color:#d6e4ef;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;z-index:40}
.marca{display:flex;align-items:center;gap:10px;padding:16px 16px 10px;color:#fff;text-decoration:none}
.marca img{width:40px;height:40px;object-fit:contain;flex:none}
.marca b{display:block;font-size:17px;line-height:1.1}.marca small{color:#9fbcd4;font-size:11.5px;letter-spacing:.04em;text-transform:uppercase}
.fechar-menu{display:none;margin-left:auto;background:none;border:0;color:#fff;font-size:26px;cursor:pointer;width:44px;height:44px}
nav{flex:1;overflow:auto;padding:4px 10px 10px}
nav .sec{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:#8fb0c9;padding:14px 10px 6px;font-weight:700}
nav a{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:8px;color:#e3edf5;text-decoration:none;margin:1px 0;min-height:40px}
nav a:hover{background:rgba(255,255,255,.08)}
nav a[aria-current=page]{background:#fff;color:var(--azul-900);font-weight:700}
nav a .ic{width:28px;height:28px;flex:none;border-radius:7px;background:#fff;display:grid;place-items:center}
nav a .ic img{width:24px;height:24px;object-fit:contain}
nav a .cnt{margin-left:auto;background:var(--p-amarelo);color:#2b2000;border-radius:10px;font-size:11.5px;padding:1px 8px;font-weight:700}
.user-box{padding:12px 16px 16px;border-top:1px solid rgba(255,255,255,.12);font-size:13px}
.user-box b{color:#fff;display:block}.user-box small{color:#a9c3d8;display:block}
.user-box .btn{margin-top:10px;width:100%;color:var(--azul-900)}
.menu-fundo{display:none}
main{min-width:0;display:flex;flex-direction:column}
.topbar{background:#fff;border-bottom:1px solid var(--borda);padding:10px 24px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:30;min-height:64px}
.topbar h1{margin:0;font-size:var(--fs-lg)}
.trilha{font-size:var(--fs-xs);color:var(--muted);display:block;margin-bottom:1px}
.btn.menu-btn{display:none}
.selo-demo{font-size:11.5px;font-weight:700;background:var(--warn-cl);color:#6b4100;border:1px solid #f0d08a;border-radius:999px;padding:3px 10px;white-space:nowrap}
#content{padding:22px 24px 40px;max-width:1440px;width:100%;flex:1}
.direitos{color:var(--muted);font-size:12px;line-height:1.5;text-align:center}
.rodape-sistema{padding:16px 24px 20px;border-top:1px solid var(--borda);background:#fff}
@media print{.rodape-sistema{display:none}}
#aviso-global:empty{display:none}

/* ---------- Cartões ---------- */
.card{background:var(--card);border:1px solid var(--borda);border-radius:var(--r);padding:18px;box-shadow:var(--sombra);margin-bottom:16px}
.card-h{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.card-h h2,.card-h h3{margin:0;font-size:var(--fs-md)}
.card-h .sub{color:var(--muted);font-size:var(--fs-sm)}
.secao-t{font-size:12px;text-transform:uppercase;color:var(--azul);letter-spacing:.06em;margin:18px 0 8px;font-weight:700;border-bottom:1px solid var(--borda);padding-bottom:5px}
.secao-t:first-child{margin-top:0}

/* ---------- Botões ---------- */
.btn{border:1px solid var(--borda-forte);background:#fff;border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:600;white-space:nowrap;text-decoration:none;display:inline-flex;align-items:center;gap:6px;justify-content:center;min-height:40px;color:var(--txt);line-height:1.2}
.btn:hover{background:#f4f6f8}
.btn:disabled,.btn[aria-disabled=true]{opacity:.5;cursor:not-allowed}
.btn[aria-busy=true]{cursor:progress}
.btn[aria-busy=true]::after{content:"";width:22px;height:10px;background:url('assets/loading/carregando-pontos.gif') center/contain no-repeat}
.btn.pri{background:var(--azul);border-color:var(--azul);color:#fff}.btn.pri:hover{background:var(--azul-esc)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}.btn.ok:hover{filter:brightness(.92)}
.btn.warn{background:#fff;border-color:var(--warn);color:var(--warn)}.btn.warn:hover{background:var(--warn-cl)}
.btn.err{background:var(--err);border-color:var(--err);color:#fff}.btn.err:hover{filter:brightness(.92)}
.btn.err-sec{background:#fff;border-color:var(--err);color:var(--err)}.btn.err-sec:hover{background:var(--err-cl)}
.btn.link{border-color:transparent;background:transparent;color:var(--azul);padding-left:6px;padding-right:6px;text-decoration:underline;text-underline-offset:3px}
.btn.link:hover{background:var(--azul-50)}
.btn.sm{padding:4px 10px;font-size:13px;min-height:32px}
.btn.lg{padding:12px 20px;font-size:var(--fs-md);min-height:48px}
.btn.block{width:100%}
.btn .ico{width:18px;height:18px}
.acoes{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.acoes.fim{justify-content:flex-end}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.end{justify-content:flex-end}

/* ---------- Formulários ---------- */
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px 16px}
.grid .s2{grid-column:span 2}.grid .s3{grid-column:span 3}.grid .full{grid-column:1/-1}
.grid .gsec{grid-column:1/-1;font-size:12px;text-transform:uppercase;color:var(--azul);letter-spacing:.06em;font-weight:700;border-bottom:1px solid var(--borda);padding-bottom:5px;margin-top:6px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field>label,.field>.lbl{font-size:13.5px;font-weight:600;color:var(--txt)}
.field .opc{font-weight:400;color:var(--muted)}
.field .dica{font-size:12.5px;color:var(--muted);margin-top:-1px}
.field .erro-msg{font-size:13px;color:var(--err);font-weight:600}
.field .erro-msg::before{content:"⚠ "}
.field .ok-msg{font-size:12.5px;color:var(--ok);font-weight:600}
.field.tem-erro{border-left:4px solid var(--err);padding-left:10px}
input,select,textarea{border:1px solid var(--borda-forte);border-radius:8px;padding:9px 11px;background:#fff;width:100%;min-height:42px}
textarea{resize:vertical;min-height:auto}
input[aria-invalid=true],select[aria-invalid=true],textarea[aria-invalid=true]{border-color:var(--err);border-width:2px}
input:disabled,select:disabled{background:#eef1f4;color:var(--muted)}
input[type=checkbox],input[type=radio]{width:18px;height:18px;min-height:0;accent-color:var(--azul);margin:0}
.chk{display:inline-flex;align-items:center;gap:8px;font-weight:400;cursor:pointer;min-height:32px}
.resumo-erros{border:3px solid var(--err);border-radius:var(--r);padding:14px 16px;margin-bottom:16px;background:#fff}
.resumo-erros h2{font-size:var(--fs-md);color:var(--err);margin-bottom:6px}
.resumo-erros ul{margin:0;padding-left:20px}.resumo-erros a{color:var(--err);font-weight:600}
.filtros{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-bottom:14px}
.filtros .field{min-width:150px;flex:0 1 auto}
.filtros .field.cresce{flex:1 1 240px}
.filtros .field>label{font-size:12px;color:var(--muted)}

/* ---------- Etapas ---------- */
.etapas{display:flex;gap:0;list-style:none;margin:0 0 18px;padding:0;counter-reset:etapa;overflow-x:auto}
.etapas li{flex:1;min-width:120px;position:relative;padding:0 6px 0 0}
.etapas button{width:100%;display:flex;align-items:center;gap:8px;border:0;background:none;padding:8px 4px;cursor:pointer;text-align:left;color:var(--muted);font-weight:600;font-size:13.5px}
.etapas button:disabled{cursor:default}
.etapas .n{width:30px;height:30px;border-radius:50%;border:2px solid var(--borda-forte);display:grid;place-items:center;flex:none;background:#fff;font-weight:700}
.etapas li.feita .n{background:var(--ok);border-color:var(--ok);color:#fff}
.etapas li.atual .n{background:var(--azul);border-color:var(--azul);color:#fff}
.etapas li.atual button{color:var(--azul-900)}
.etapas li::after{content:"";position:absolute;left:38px;right:10px;bottom:0;height:3px;background:var(--borda);border-radius:2px}
.etapas li.feita::after,.etapas li.atual::after{background:var(--azul)}

/* ---------- Tabelas ---------- */
.tbl-wrap{overflow:auto;border:1px solid var(--borda);border-radius:var(--r);position:relative;
  /* sombra nas laterais indica que há mais colunas para rolar */
  background:linear-gradient(to right,#fff 30%,rgba(255,255,255,0)),linear-gradient(to left,#fff 30%,rgba(255,255,255,0)) 100% 0,
    radial-gradient(farthest-side at 0 50%,rgba(0,0,0,.22),rgba(0,0,0,0)),radial-gradient(farthest-side at 100% 50%,rgba(0,0,0,.22),rgba(0,0,0,0)) 100% 0;
  background-color:#fff;background-repeat:no-repeat;background-size:40px 100%,40px 100%,14px 100%,14px 100%;background-attachment:local,local,scroll,scroll}
table{width:100%;border-collapse:collapse;background:transparent}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid #e8ecf0;vertical-align:middle}
th{background:#f6f8fa;font-size:12px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.03em;position:sticky;top:0;z-index:1}
th button.ord{all:unset;cursor:pointer;display:inline-flex;gap:4px;align-items:center}
th button.ord:focus-visible{outline:3px solid var(--foco)}
th[aria-sort=ascending] button.ord::after{content:"▲";font-size:9px}
th[aria-sort=descending] button.ord::after{content:"▼";font-size:9px}
td.n,th.n{text-align:right}
tr.tot td{font-weight:700;background:#f6f8fa}
tr.clicavel{cursor:pointer}tr.clicavel:hover td{background:var(--azul-50)}
tr.sel td{background:var(--azul-cl)}
td small,.sub-linha{color:var(--muted);display:block;font-size:12.5px}
.tbl-info{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:8px 2px;color:var(--muted);font-size:13px;flex-wrap:wrap}

/* ---------- Etiquetas ---------- */
.badge{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font-size:12.5px;font-weight:700;white-space:nowrap;border:1px solid transparent;line-height:1.5}
.badge .s{font-size:11px}
.pr-vermelho{background:var(--p-vermelho);color:#fff}
.pr-amarelo{background:#ffd75e;color:#3d2c00;border-color:#d9a900}
.pr-verde{background:var(--p-verde);color:#fff}
.pr-azul{background:var(--p-azul);color:#fff}
.st-pendente,.st-autorizada{background:#fff4d6;color:#6b4a00;border-color:#efd08a}
.st-regulacao{background:#efe7fb;color:#4b2a86;border-color:#d4c3f2}
.st-devolvida{background:#ffe6d5;color:#7a3300;border-color:#f3c09c}
.st-negada{background:var(--err-cl);color:#7f1d1d;border-color:#f3b8b2}
.st-agendada{background:#dcebfb;color:#0b3f78;border-color:#a9c9ee}
.st-realizada{background:var(--ok-cl);color:#14532d;border-color:#a8d5b5}
.st-faltou{background:var(--err-cl);color:#7f1d1d;border-color:#f3b8b2}
.st-cancelada{background:#eef0f2;color:#4a5562;border-color:#d0d6dc}
.st-livre{background:var(--ok-cl);color:#14532d;border-color:#a8d5b5}
.st-ocupada{background:#dcebfb;color:#0b3f78;border-color:#a9c9ee}
.st-bloqueada{background:#eef0f2;color:#4a5562;border-color:#d0d6dc}
.st-ativo{background:var(--ok-cl);color:#14532d;border-color:#a8d5b5}
.st-inativo{background:#eef0f2;color:#4a5562;border-color:#d0d6dc}
.tag{display:inline-block;font-size:11.5px;font-weight:700;padding:1px 7px;border-radius:5px;background:#efe7fb;color:#4b2a86;border:1px solid #d4c3f2;white-space:nowrap}
.tag.inc{background:var(--warn-cl);color:#6b4100;border-color:#f0d08a}

/* ---------- Indicadores ---------- */
.periodo{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;color:var(--muted);font-size:13.5px;margin-bottom:14px}
.periodo b{color:var(--txt)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:16px}
.kpi{background:#fff;border:1px solid var(--borda);border-radius:var(--r);padding:14px 16px;box-shadow:var(--sombra);text-decoration:none;color:inherit;display:flex;flex-direction:column;border-top:4px solid var(--borda-forte);min-height:110px}
a.kpi:hover{border-color:var(--azul);background:var(--azul-50)}
.kpi .l{color:var(--txt);font-size:13.5px;font-weight:600}
.kpi .v{font-size:30px;font-weight:800;margin:2px 0;line-height:1.15}
.kpi .s{color:var(--muted);font-size:12.5px;margin-top:auto}
.kpi .ir{color:var(--azul);font-size:12.5px;font-weight:700;margin-top:4px}
.kpi.c-amarelo{border-top-color:var(--p-amarelo)}.kpi.c-azul{border-top-color:var(--azul)}.kpi.c-verde{border-top-color:var(--ok)}
.kpi.c-vermelho{border-top-color:var(--err)}.kpi.c-roxo{border-top-color:#6d3fc0}.kpi.c-teal{border-top-color:var(--teal)}
.atalhos{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-bottom:18px}
.atalho{background:#fff;border:1px solid var(--borda);border-radius:var(--r);padding:12px 14px;text-decoration:none;color:var(--txt);display:flex;gap:12px;align-items:center;min-height:64px;box-shadow:var(--sombra)}
.atalho:hover{border-color:var(--azul);background:var(--azul-50)}
.atalho img{width:38px;height:38px;flex:none}
.atalho b{display:block}.atalho small{color:var(--muted)}
.atalho.pri{background:var(--azul);border-color:var(--azul);color:#fff}.atalho.pri small{color:#cfe0ee}.atalho.pri:hover{background:var(--azul-esc)}
.atalho.pri img{background:#fff;border-radius:8px;padding:3px}
.cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.cols>.card{margin-bottom:0}
.bar{display:grid;grid-template-columns:minmax(120px,220px) 1fr 44px;align-items:center;gap:10px;margin:8px 0}
.bar .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .t{background:#eef2f6;border-radius:6px;height:14px;overflow:hidden}
.bar .t i{display:block;height:100%;background:var(--azul);border-radius:6px}
.bar .c{text-align:right;font-weight:700}
.bar.pr-v .t i{background:var(--p-vermelho)}.bar.pr-a .t i{background:var(--p-amarelo)}.bar.pr-g .t i{background:var(--p-verde)}.bar.pr-b .t i{background:var(--p-azul)}
.lista-alertas{list-style:none;margin:0;padding:0}
.lista-alertas li{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid #e8ecf0}
.lista-alertas li:last-child{border-bottom:0}

/* ---------- Avisos e estados ---------- */
.alert{padding:12px 14px;border-radius:var(--r);margin-bottom:12px;border:1px solid;border-left-width:5px;display:flex;gap:10px;align-items:flex-start}
.alert .ai{font-weight:800;flex:none}
.alert>div{flex:1;min-width:0}
.alert.err{background:var(--err-cl);border-color:var(--err);color:#5f1410}
.alert.info{background:var(--info-cl);border-color:var(--azul);color:var(--azul-900)}
.alert.warn{background:var(--warn-cl);border-color:var(--warn);color:#4f2f00}
.alert.ok{background:var(--ok-cl);border-color:var(--ok);color:#0f3d20}
.alert b.t{display:block;margin-bottom:2px}
.alert .acoes{margin-top:8px}
.estado{text-align:center;padding:36px 20px;color:var(--muted)}
.estado img{width:56px;height:56px;margin-bottom:10px;opacity:.9}
.estado h3{color:var(--txt);font-size:var(--fs-md);margin-bottom:4px}
.estado .acoes{justify-content:center;margin-top:14px}
.carregando{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:40px;color:var(--muted)}
.carregando img{width:48px;height:48px}
.carregando.inline{flex-direction:row;padding:10px}
.carregando.inline img{width:24px;height:24px}
#toasts{position:fixed;right:16px;bottom:16px;display:flex;flex-direction:column;gap:8px;z-index:300;max-width:calc(100vw - 32px)}
.toast{background:#1f2937;color:#fff;padding:12px 16px;border-radius:8px;box-shadow:var(--sombra-lg);max-width:400px;display:flex;gap:10px;align-items:flex-start}
.toast.err{background:var(--err)}.toast.ok{background:var(--ok)}
.toast button{background:none;border:0;color:#fff;font-size:18px;cursor:pointer;line-height:1;margin-left:auto}

/* ---------- Detalhes ---------- */
.dl{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px 18px;margin:0 0 6px}
.dl>div{min-width:0}
.dl dt,.dl .k{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;font-weight:600}
.dl dd,.dl .v{margin:0;font-weight:500;overflow-wrap:anywhere}
.box{background:#f8fafc;border:1px solid var(--borda);border-radius:8px;padding:10px 12px;white-space:pre-wrap}
.timeline{list-style:none;margin:0;padding:0 0 0 16px;border-left:2px solid var(--borda)}
.timeline li{position:relative;padding:0 0 14px 12px}
.timeline li::before{content:"";position:absolute;left:-23px;top:5px;width:12px;height:12px;border-radius:50%;background:#fff;border:3px solid var(--azul)}
.timeline small{color:var(--muted)}
.pac-card{background:var(--azul-50);border:1px solid #c5d9ea;border-radius:var(--r);padding:14px 16px;display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap}
.pac-card .nome{font-size:var(--fs-md);font-weight:700}
.resultado-busca{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.resultado-busca .item{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--borda);border-radius:8px;background:#fff;cursor:pointer;text-align:left;width:100%;min-height:56px}
.resultado-busca .item:hover{border-color:var(--azul);background:var(--azul-50)}
.proc-list{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.proc-list .pi{display:flex;justify-content:space-between;align-items:center;gap:10px;border:1px solid var(--borda);border-radius:8px;padding:8px 12px;background:#fbfcfd;flex-wrap:wrap}
.revisao{display:grid;gap:12px}
.revisao section{border:1px solid var(--borda);border-radius:var(--r);padding:14px 16px}
.revisao h3{display:flex;justify-content:space-between;align-items:center;font-size:var(--fs-md);gap:8px}
.prio-opts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.prio-opts label{border:2px solid var(--borda);border-radius:var(--r);padding:10px 12px;cursor:pointer;display:flex;gap:10px;align-items:flex-start;background:#fff}
.prio-opts label:hover{border-color:var(--borda-forte)}
.prio-opts label:has(input:checked){border-color:var(--azul);background:var(--azul-cl);box-shadow:inset 0 0 0 1px var(--azul)}
.prio-opts input{margin-top:3px}
.prio-opts small{display:block;color:var(--muted)}
.criterios{font-size:13px;color:var(--muted);margin-top:10px}
.criterios summary{cursor:pointer;color:var(--azul);font-weight:600}

/* ---------- Fila (lista + detalhe) ---------- */
.mestre{display:grid;grid-template-columns:minmax(320px,420px) 1fr;gap:16px;align-items:start}
.fila{display:flex;flex-direction:column;gap:6px;max-height:calc(100vh - 300px);min-height:200px;overflow:auto;padding:2px}
.fila .it{border:1px solid var(--borda);border-radius:8px;padding:10px 12px;cursor:pointer;background:#fff;text-align:left;width:100%;display:block}
.fila .it:hover{background:var(--azul-50)}
.fila .it[aria-selected=true]{border-color:var(--azul);background:var(--azul-cl);box-shadow:inset 4px 0 0 var(--azul)}
.fila .it .t1{display:flex;justify-content:space-between;gap:8px;align-items:center}
.fila .it .t1 b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fila .it small{color:var(--muted);display:block;margin-top:2px}
.fila .it .tags{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}
.compacta .fila .it{padding:6px 10px}.compacta .fila .it .x{display:none}

/* ---------- Agenda / vagas ---------- */
.slots{display:flex;flex-direction:column;gap:14px;max-height:440px;overflow:auto;margin:8px 0 14px;padding:2px}
.slot-day h4{font-size:13.5px;margin:0 0 6px}
.slot-day .row{gap:6px}
.slot{border:1px solid var(--borda-forte);border-radius:8px;padding:6px 10px;cursor:pointer;background:#fff;text-align:left;min-width:120px;min-height:48px}
.slot:hover{border-color:var(--azul)}
.slot small{display:block;color:var(--muted);font-size:11.5px}
.slot[aria-pressed=true]{background:var(--azul);color:#fff;border-color:var(--azul)}.slot[aria-pressed=true] small{color:#d6e6f3}
.seg{display:inline-flex;border:1px solid var(--borda-forte);border-radius:8px;overflow:hidden;background:#fff;flex-wrap:wrap}
.seg button{border:0;background:none;padding:8px 14px;cursor:pointer;font-weight:600;color:var(--muted);min-height:40px}
.seg button+button{border-left:1px solid var(--borda-forte)}
.seg button[aria-pressed=true]{background:var(--azul);color:#fff}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .dow{font-size:11px;font-weight:700;color:var(--muted);text-align:center;padding:4px 0;text-transform:uppercase}
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;gap:8px}
.mini{width:340px;max-width:100%}
.mini .dia{border:1px solid var(--borda);background:#fff;border-radius:8px;padding:8px 0;cursor:pointer;text-align:center;position:relative;font-weight:600;min-height:40px}
.mini .dia:hover:not(:disabled){border-color:var(--azul)}
.mini .dia[aria-pressed=true]{background:var(--azul);color:#fff;border-color:var(--azul)}
.mini .dia:disabled{opacity:.3;cursor:not-allowed}
.mini .dia.fer{color:var(--err);text-decoration:underline dotted}.mini .dia[aria-pressed=true].fer{color:#ffd7d7}
.mini .dia.tem::after{content:"";position:absolute;bottom:3px;left:50%;width:6px;height:6px;margin-left:-3px;border-radius:50%;background:var(--p-amarelo)}
.legenda{display:flex;gap:14px;flex-wrap:wrap;margin-top:12px;font-size:12.5px}
.legenda span{display:inline-flex;align-items:center;gap:6px}
.leg-cor{width:14px;height:14px;border-radius:4px;display:inline-block}.leg-cor.on{background:var(--azul)}.leg-cor.tem{background:var(--p-amarelo);border-radius:50%;width:8px;height:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:4px;background:var(--azul-cl);border:1px solid #b9d4ea;border-radius:999px;padding:3px 8px 3px 10px;font-size:12.5px;font-weight:600}
.chip button{border:0;background:none;cursor:pointer;color:var(--muted);font-size:16px;line-height:1;padding:0 3px;min-width:24px;min-height:24px}
.chip button:hover{color:var(--err)}
.chip.warn{background:var(--warn-cl);border-color:#f0d08a;color:#6b4100}
.chip.off{background:#f1f3f5;border-color:var(--borda);color:var(--muted)}
.turno{display:grid;grid-template-columns:180px 110px 110px 110px 120px 1fr auto;gap:10px;align-items:end;border:1px solid var(--borda);border-radius:8px;padding:10px 12px;margin-bottom:8px;background:#fbfcfd}
.turno .t-res{align-self:center;color:var(--muted);font-size:13px;padding-top:16px}
.big-cal .cal-d{min-height:108px;border:1px solid var(--borda);border-radius:8px;background:#fff;padding:5px 6px;cursor:pointer;overflow:hidden;min-width:0;text-align:left;font:inherit;display:block;width:100%}
.big-cal .cal-d:hover{border-color:var(--azul)}
.big-cal .vazio{background:transparent;border:0}
.big-cal .cal-d.hoje{box-shadow:inset 0 0 0 2px var(--azul)}
.big-cal .cal-d.fds{background:#f7f8fa}
.big-cal .cal-d.passado{opacity:.65}
.cal-n{font-weight:700;font-size:12.5px;margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.cal-n small{color:var(--err);font-weight:600}
.cal-ev{font-size:11.5px;border-left:3px solid var(--ok);background:#eef7f1;border-radius:4px;padding:2px 5px;margin-top:3px;line-height:1.3}
.cal-ev.cheio{border-color:var(--azul);background:#e8f1f8}
.cal-ev b,.cal-ev span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal-ev span{color:var(--muted)}
.cal-ev em{float:right;font-style:normal;font-weight:700;margin-left:4px;color:var(--ok)}.cal-ev.cheio em{color:var(--azul)}
.cal-mais{font-size:11.5px;color:var(--azul);margin-top:3px;font-weight:700}
.semana{display:grid;grid-template-columns:repeat(7,minmax(150px,1fr));gap:8px;overflow-x:auto}
.semana .col{background:#fff;border:1px solid var(--borda);border-radius:var(--r);min-height:200px;display:flex;flex-direction:column}
.semana .col.hoje{border-color:var(--azul);box-shadow:inset 0 3px 0 var(--azul)}
.semana .col h3{font-size:13.5px;padding:8px 10px;margin:0;border-bottom:1px solid var(--borda);background:#f6f8fa;border-radius:var(--r) var(--r) 0 0}
.semana .col h3 small{display:block;color:var(--err);font-weight:600}
.semana .bl{margin:6px;padding:8px;border:1px solid var(--borda);border-radius:8px;font-size:12.5px;cursor:pointer;background:#fff;text-align:left;font:inherit;font-size:12.5px}
.semana .bl:hover{border-color:var(--azul)}
.semana .bl b{display:block}
.semana .bl .cont{display:flex;gap:4px;flex-wrap:wrap;margin-top:5px}
.semana .vazio{color:var(--sutil);font-size:12.5px;padding:10px;text-align:center}

/* ---------- Confirmação ---------- */
.guia-busca{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.guia-busca input{font-size:26px;letter-spacing:.12em;font-weight:800;padding:10px 14px;max-width:300px;min-height:56px}
.res-guia{border:2px solid var(--azul);border-radius:var(--r-lg);padding:18px;margin-top:14px}
.res-guia .gnum{font-size:28px;font-weight:800;color:var(--azul);letter-spacing:.06em}
.res-guia.fim-ok{border-color:var(--ok)}.res-guia.fim-err{border-color:var(--err)}

/* ---------- Abas e modais ---------- */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--borda);margin-bottom:16px;flex-wrap:wrap}
.tabs button,.tabs a{padding:10px 16px;text-decoration:none;border:0;background:none;border-bottom:3px solid transparent;color:var(--muted);font-weight:700;cursor:pointer;min-height:44px}
.tabs [aria-selected=true]{color:var(--azul);border-color:var(--azul)}
.modal-bg{position:fixed;inset:0;background:rgba(10,20,35,.55);display:grid;place-items:center;padding:16px;z-index:100}
.modal{background:#fff;border-radius:var(--r-lg);width:100%;max-width:640px;max-height:calc(100vh - 32px);display:flex;flex-direction:column;box-shadow:var(--sombra-lg)}
.modal.wide{max-width:960px}
.modal.estreito{max-width:520px}
.modal>header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 20px;border-bottom:1px solid var(--borda)}
.modal>header h2{margin:0;font-size:var(--fs-lg)}
.modal .x{border:0;background:none;font-size:26px;cursor:pointer;color:var(--muted);line-height:1;width:44px;height:44px;border-radius:8px}
.modal .x:hover{background:#f0f2f5}
.modal-body{padding:18px 20px;overflow:auto}
.modal>footer{padding:12px 20px;border-top:1px solid var(--borda);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.modal>footer:empty{display:none}
.voltar{display:inline-flex;align-items:center;gap:4px;margin-bottom:12px}

.print-only{display:none}
.filtros-toggle{display:none!important}

/* ---------- Telas menores ---------- */
@media (max-width:1100px){
  .mestre{grid-template-columns:1fr}
  .fila{max-height:420px}
  .cols{grid-template-columns:1fr}
}
@media (max-width:900px){
  #app{grid-template-columns:1fr}
  aside{position:fixed;left:0;top:0;bottom:0;width:min(300px,86vw);transform:translateX(-105%);transition:transform .2s;box-shadow:var(--sombra-lg)}
  aside.aberto{transform:none}
  .menu-fundo.aberto{display:block;position:fixed;inset:0;background:rgba(10,20,35,.5);z-index:35}
  .fechar-menu{display:inline-block}
  .btn.menu-btn{display:inline-flex}
  .topbar{padding:8px 12px;gap:8px}
  .topbar h1{font-size:17px}
  #content{padding:14px 12px 40px}
  .grid,.prio-opts{grid-template-columns:repeat(2,minmax(0,1fr))}
  .turno{grid-template-columns:1fr 1fr}
  .big-cal .cal-d{min-height:64px}.cal-ev span{display:none}
  .selo-demo{display:none}
}
@media (max-width:760px){
  /* tabelas viram cartões */
  table.resp thead{display:none}
  table.resp,table.resp tbody,table.resp tr,table.resp td{display:block;width:100%}
  table.resp tr{border-bottom:1px solid var(--borda);padding:8px 4px}
  table.resp td{border:0;padding:3px 10px;display:block}
  table.resp td::before{content:attr(data-label);display:block;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.03em}
  table.resp td[data-label=""]::before{content:none}
  .filtros.recolhivel:not(.aberto) .field:not(.cresce),.filtros.recolhivel:not(.aberto) .btn.link{display:none}
  .filtros-toggle{display:inline-flex!important}
  table.resp td.n{text-align:left}
  table.resp tr.tot{background:#f6f8fa}
  .grid{grid-template-columns:1fr}
  .grid .s2,.grid .s3{grid-column:1/-1}
  .prio-opts{grid-template-columns:1fr}
  .filtros .field{flex:1 1 100%}
  .modal-bg{padding:0;place-items:end stretch}
  .modal{max-height:94vh;border-radius:var(--r-lg) var(--r-lg) 0 0}
  .modal>footer .btn{flex:1 1 auto}
  .bar{grid-template-columns:110px 1fr 36px}
  .etapas li{min-width:56px}.etapas .rot{display:none}
  .etapas li.atual .rot{display:inline}
  .guia-busca input{max-width:none;flex:1 1 100%}
}
@media (prefers-reduced-motion:reduce){
  *{transition:none!important;animation:none!important}
  .carregando img,.btn[aria-busy=true]::after{display:none}
}
@media print{
  @page{size:A4 landscape;margin:10mm}
  aside,.topbar,.no-print,.filtros,#toasts,.menu-fundo,.acoes .btn{display:none!important}
  #app{display:block}#content{padding:0;max-width:none}
  body{background:#fff;font-size:11px}
  .card{box-shadow:none;break-inside:avoid;border-color:#999}
  .tbl-wrap{overflow:visible;border:0}
  th,td{padding:4px 6px}
  th{position:static}
  .kpi{min-height:0;box-shadow:none}
  .print-only{display:block}
}
</style>
</head>
