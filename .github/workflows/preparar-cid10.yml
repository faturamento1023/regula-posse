name: Preparar CID-10
on:
  push:
    paths:
      - .github/workflows/preparar-cid10.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  extrair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Baixar e converter catálogo
        run: |
          python3 - <<'PY'
          import csv, hashlib, io, json, pathlib, urllib.request, zipfile

          # O DATASUS é a fonte oficial; o espelho entra só se ele não responder,
          # e a origem usada fica registrada no manifesto junto com o hash.
          FONTES = [
            'http://www2.datasus.gov.br/cid10/V2008/downloads/CID10CSV.zip',
            'https://github.com/msrodrigues/cid10/raw/master/data-raw/CID10CSV.zip',
          ]
          data = origem = None
          erros = []
          for url in FONTES:
              try:
                  req = urllib.request.Request(url, headers={'User-Agent': 'regula-posse/1.0'})
                  with urllib.request.urlopen(req, timeout=120) as resp:
                      data = resp.read()
                  origem = url
                  break
              except Exception as e:
                  erros.append(f'{url}: {e}')
          if data is None:
              raise SystemExit('Nenhuma fonte respondeu:\n' + '\n'.join(erros))

          z = zipfile.ZipFile(io.BytesIO(data))
          nomes = {n.upper().split('/')[-1]: n for n in z.namelist()}

          def ler(arquivo):
              with z.open(nomes[arquivo]) as f:
                  texto = f.read().decode('latin1')
              return list(csv.DictReader(io.StringIO(texto), delimiter=';'))

          # Capítulos, para marcar cada código com o capítulo a que pertence.
          capitulos = []
          for r in ler('CID-10-CAPITULOS.CSV'):
              capitulos.append((r['CATINIC'].strip(), r['CATFIM'].strip(), r['NUMCAP'].strip()))

          def capitulo_de(cat):
              for ini, fim, num in capitulos:
                  if ini <= cat <= fim:
                      return num
              return None

          linhas = []
          for r in ler('CID-10-CATEGORIAS.CSV'):
              cod = r['CAT'].strip().upper()
              desc = (r.get('DESCRICAO') or '').strip()
              if not cod or not desc:
                  continue
              linhas.append((cod, desc, 'categoria', capitulo_de(cod[:3])))

          for r in ler('CID-10-SUBCATEGORIAS.CSV'):
              bruto = r['SUBCAT'].strip().upper()
              desc = (r.get('DESCRICAO') or '').strip()
              if len(bruto) != 4 or not desc:
                  continue
              cod = f'{bruto[:3]}.{bruto[3]}'
              linhas.append((cod, desc, 'subcategoria', capitulo_de(bruto[:3])))

          # Validações: se o layout do arquivo mudar, isto falha alto em vez
          # de comitar um catálogo truncado ou embaralhado.
          cats = [l for l in linhas if l[2] == 'categoria']
          subs = [l for l in linhas if l[2] == 'subcategoria']
          if not 1500 <= len(cats) <= 2600:
              raise SystemExit(f'Quantidade inesperada de categorias: {len(cats)}')
          if not 9000 <= len(subs) <= 15000:
              raise SystemExit(f'Quantidade inesperada de subcategorias: {len(subs)}')
          if len(linhas) != len({l[0] for l in linhas}):
              raise SystemExit('Códigos duplicados no catálogo')
          for cod, _, nivel, _ in linhas:
              esperado = 3 if nivel == 'categoria' else 5
              if len(cod) != esperado:
                  raise SystemExit(f'Código com formato inesperado: {cod}')
          if not any(c[0] == 'I20' for c in cats):
              raise SystemExit('Código de referência I20 ausente — arquivo suspeito')

          saida = pathlib.Path('data/cid10')
          saida.mkdir(parents=True, exist_ok=True)
          for antigo in saida.glob('parte-*.sql'):
              antigo.unlink()

          aspas = lambda s: "'" + s.replace("'", "''") + "'"
          nulo  = lambda s: aspas(s) if s else 'null'
          LOTE = 800
          for i in range(0, len(linhas), LOTE):
              valores = ',\n'.join(
                  f'({aspas(c)}, {aspas(d)}, {aspas(n)}, {nulo(cap)}, \'2008\')'
                  for c, d, n, cap in linhas[i:i+LOTE])
              sql = ('-- CID-10, DATASUS. Catálogo de referência para o campo CID-10 da solicitação.\n'
                     'insert into public.cid10 (codigo,descricao,nivel,capitulo,competencia) values\n'
                     + valores + '\non conflict (codigo) do update set\n'
                     ' descricao = excluded.descricao, nivel = excluded.nivel, capitulo = excluded.capitulo;\n')
              (saida / f'parte-{i//LOTE+1:02d}.sql').write_text(sql, encoding='utf-8')

          manifesto = {
            'registros': len(linhas),
            'categorias': len(cats),
            'subcategorias': len(subs),
            'partes': (len(linhas) + LOTE - 1) // LOTE,
            'sha256_zip': hashlib.sha256(data).hexdigest(),
            'fonte': origem,
            'fontes_tentadas': FONTES,
          }
          (saida / 'manifesto.json').write_text(
              json.dumps(manifesto, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          print(f'{len(cats)} categorias e {len(subs)} subcategorias de {origem}')
          PY
      - name: Registrar arquivos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/cid10
          git commit -m "Prepara catálogo CID-10" || exit 0
          git pull --rebase origin main
          git push origin main
